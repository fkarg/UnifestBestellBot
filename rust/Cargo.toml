[package]
name = "unifestbestellbot"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
description = "Telegram bot for stalls at the Karlsruhe Unifest to order supplies — Rust port"
authors = ["Felix Karg <f.karg10@gmail.com>"]
license = "GPL-3.0-or-later"

[dependencies]
# Telegram bot framework — async, dialogue FSM, dependency injection.
# default-features disabled to drop native-tls; we use rustls everywhere
# so there's no OpenSSL on the build path.
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }

# DB: SQLite via sqlx with compile-time-checked queries disabled (we use
# the `query()` macro rather than `query!()` to avoid needing a live DB
# at compile time).
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "macros"] }

# Web framework + SSE.
axum = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Async runtime.
tokio = { version = "1", features = ["full"] }

# Serialization & config.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Env / settings.
dotenvy = "0.15"

# HTTP client for Engelsystem.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Datetimes.
chrono = { version = "0.4", features = ["serde"] }

# Logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time", "chrono"] }
tracing-appender = "0.2"

# Error handling.
anyhow = "1"
thiserror = "2"

# Misc.
async-trait = "0.1"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
pretty_assertions = "1"
tempfile = "3"
wiremock = "0.6"
reqwest-eventsource = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "unifestbestellbot"
path = "src/main.rs"
