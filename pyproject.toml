[project]
name = "unifestbestellbot"
version = "0.2.0"
description = "Telegram bot for stalls at the Karlsruhe Unifest to order supplies"
authors = [
    { name = "Felix Karg", email = "f.karg10@gmail.com" },
]
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
readme = "README.md"

dependencies = [
    "aiogram>=3.13,<4.0",
    "sqlmodel>=0.0.22,<0.1",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.40",
    "httpx>=0.28,<0.29",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
unifestbestellbot = "unifestbestellbot.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unifestbestellbot"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.30",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src/unifestbestellbot", "tests"]
extend-exclude = [
    # Legacy code, removed in the cutover commit.
    "main.py",
    "experiments.py",
    "src/commands.py",
    "src/config.py",
    "src/dashboard_bridge.py",
    "src/engelsystem.py",
    "src/parser.py",
    "src/states.py",
    "src/tickets.py",
    "src/tickets_data.py",
    "src/utils.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
